<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contacts - Kashru Technologies</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }


        .navbar {

            height: 70px;

            background: #111827;

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;

        }


        .navbar h2 {
            font-size: 22px;
        }


        .buttons {
            display: flex;
            gap: 10px;
        }


        button {

            border: none;

            padding: 10px 18px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: 600;

        }


        .back {

            background: #374151;

            color: white;

        }


        .logout {

            background: #dc2626;

            color: white;

        }


        .container {

            padding: 30px;

        }


        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

        }


        .header h1 {
            margin-bottom: 5px;
        }


        .header p {
            color: #6b7280;
        }


        .refresh {

            background: #2563eb;

            color: white;

        }


        .search-box {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            margin-bottom: 20px;

        }


        .table-container {

            background: white;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.08);

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

        }


        th,
        td {

            padding: 15px;

            text-align: left;

            border-bottom: 1px solid #eee;

        }


        th {

            background: #f9fafb;

            color: #374151;

        }


        td {

            color: #4b5563;

        }


        .view-btn {

            background: #2563eb;

            color: white;

            margin-right: 5px;

        }


        .delete-btn {

            background: #dc2626;

            color: white;

        }


        .empty {

            text-align: center;

            padding: 40px;

            color: #6b7280;

        }


        .loading {

            text-align: center;

            padding: 40px;

            color: #6b7280;

        }


        @media (max-width: 700px) {

            .container {
                padding: 15px;
            }


            .navbar {
                padding: 0 15px;
            }


            .navbar h2 {
                font-size: 17px;
            }


            .header {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;

            }

        }

    </style>

</head>


<body>


<nav class="navbar">

    <h2>Kashru Technologies Admin</h2>


    <div class="buttons">

        <button
            class="back"
            onclick="goBack()"
        >
            Dashboard
        </button>


        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>


<div class="container">


    <div class="header">

        <div>

            <h1>Contact Messages</h1>

            <p>
                Website contact enquiries
            </p>

        </div>


        <button
            class="refresh"
            onclick="loadContacts()"
        >
            🔄 Refresh
        </button>

    </div>


    <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="Search by name, email or message..."
        oninput="searchContacts()"
    >


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Date</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="contactTable">

                <tr>

                    <td
                        colspan="5"
                        class="loading"
                    >
                        Loading contacts...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>


const API_URL =
    "https://kashru-backend.onrender.com";


let contacts = [];


// ================================
// LOGIN CHECK
// ================================

const admin = localStorage.getItem("admin");


if (!admin) {

    window.location.href =
        "admin-login.html";

}


// ================================
// LOAD CONTACTS
// ================================

async function loadContacts() {

    const table =
        document.getElementById("contactTable");


    table.innerHTML = `
        <tr>
            <td colspan="5" class="loading">
                Loading contacts...
            </td>
        </tr>
    `;


    try {

        const response =
            await fetch(
                `${API_URL}/api/contact`
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load contacts"
            );

        }


        contacts =
            await response.json();


        displayContacts(contacts);


    } catch (error) {

        console.error(error);


        table.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    Failed to load contacts
                </td>
            </tr>
        `;

    }

}


// ================================
// DISPLAY CONTACTS
// ================================

function displayContacts(data) {

    const table =
        document.getElementById("contactTable");


    if (!data || data.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    No contact messages found
                </td>
            </tr>
        `;

        return;

    }


    table.innerHTML =
        data.map(contact => `

            <tr>

                <td>
                    ${contact.id}
                </td>

                <td>
                    ${contact.name || "-"}
                </td>

                <td>
                    ${contact.email || "-"}
                </td>

                <td>
                    ${
                        contact.createdAt
                            ? new Date(
                                contact.createdAt
                              ).toLocaleString()
                            : "-"
                    }
                </td>

                <td>

                    <button
                        class="view-btn"
                        onclick="viewContact(${contact.id})"
                    >
                        View
                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteContact(${contact.id})"
                    >
                        Delete
                    </button>

                </td>

            </tr>

        `).join("");

}


// ================================
// SEARCH
// ================================

function searchContacts() {

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    if (!search) {

        displayContacts(contacts);

        return;

    }


    const filtered =
        contacts.filter(contact => {

            return (

                (contact.name || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (contact.email || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (contact.message || "")
                    .toLowerCase()
                    .includes(search)

            );

        });


    displayContacts(filtered);

}


// ================================
// VIEW CONTACT
// ================================

async function viewContact(id) {

    try {

        const response =
            await fetch(
                `${API_URL}/api/contact/${id}`
            );


        if (!response.ok) {

            throw new Error(
                "Contact not found"
            );

        }


        const contact =
            await response.json();


        alert(

            "Name: " +
            (contact.name || "-") +

            "\n\nEmail: " +
            (contact.email || "-") +

            "\n\nPhone: " +
            (contact.phone || "-") +

            "\n\nMessage: " +
            (contact.message || "-") +

            "\n\nDate: " +
            (
                contact.createdAt
                    ? new Date(
                        contact.createdAt
                      ).toLocaleString()
                    : "-"
            )

        );


    } catch (error) {

        alert(
            "Failed to load contact"
        );

    }

}


// ================================
// DELETE CONTACT
// ================================

async function deleteContact(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this contact?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/contact/${id}`,
                {
                    method: "DELETE"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Delete failed"
            );

        }


        alert(
            "Contact deleted successfully"
        );


        loadContacts();


    } catch (error) {

        console.error(error);


        alert(
            "Failed to delete contact"
        );

    }

}


// ================================
// DASHBOARD
// ================================

function goBack() {

    window.location.href =
        "admin-dashboard.html";

}


// ================================
// LOGOUT
// ================================

function logout() {

    localStorage.removeItem("admin");

    window.location.href =
        "admin-login.html";

}


// ================================
// INITIAL LOAD
// ================================

loadContacts();


</script>


</body>

</html>
