services:
  - type: web
    name: kashru-chatbot-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/build_index.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: EMBEDDING_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: FAISS_INDEX_DIR
        value: storage/faiss_index
      - key: KNOWLEDGE_DIR
        value: knowledge
      - key: ALLOWED_ORIGINS
        value: https://kashru.san-vad.com
