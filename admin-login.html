<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Kashru Technologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-0:#0a0e1a;
    --bg-1:#0f1526;
    --panel:rgba(255,255,255,0.045);
    --panel-border:rgba(255,255,255,0.09);
    --ink:#e9ecf7;
    --ink-dim:#8a93ad;
    --violet:#7c5cfc;
    --cyan:#22d3ee;
    --danger:#ff6b81;
    --success:#4ade9a;
    --radius:20px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Inter', Arial, sans-serif;
    background:
      radial-gradient(1100px 600px at 20% 15%, rgba(124,92,252,0.16), transparent 60%),
      radial-gradient(900px 700px at 85% 85%, rgba(34,211,238,0.10), transparent 55%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
    color:var(--ink);
    overflow:hidden;
    position:relative;
    perspective:1400px;
  }

  /* server-room floor grid, receding into the distance */
  .floor{
    position:absolute;
    inset:auto 0 0 0;
    height:60vh;
    background-image:
      linear-gradient(rgba(124,92,252,0.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,92,252,0.16) 1px, transparent 1px);
    background-size:56px 56px;
    transform:perspective(700px) rotateX(62deg) translateY(20%);
    transform-origin:bottom;
    mask-image:linear-gradient(to top, rgba(0,0,0,0.9), transparent 85%);
    -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,0.9), transparent 85%);
    opacity:0.55;
    pointer-events:none;
  }

  /* drifting particles */
  .particle{
    position:absolute;
    width:3px; height:3px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 8px 2px rgba(34,211,238,0.7);
    opacity:0.6;
    animation:drift 14s linear infinite;
    pointer-events:none;
  }
  @keyframes drift{
    0%   { transform:translateY(0) translateX(0); opacity:0; }
    10%  { opacity:0.7; }
    90%  { opacity:0.5; }
    100% { transform:translateY(-90vh) translateX(30px); opacity:0; }
  }

  .stage{
    position:relative;
    width:400px;
    max-width:92vw;
    transform-style:preserve-3d;
    transform:rotateX(6deg) rotateY(-8deg);
    transition:transform 0.15s ease-out;
    animation:settle 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes settle{
    0%   { transform:rotateX(28deg) rotateY(-30deg) translateY(40px) scale(0.92); opacity:0; }
    100% { transform:rotateX(6deg) rotateY(-8deg) translateY(0) scale(1); opacity:1; }
  }

  .badge-clip{
    position:absolute;
    top:-46px; left:50%;
    transform:translateX(-50%) translateZ(70px);
    width:64px; height:64px;
    border-radius:16px;
    background:linear-gradient(145deg, var(--violet), var(--cyan));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 18px 40px -12px rgba(124,92,252,0.65), 0 0 0 6px rgba(255,255,255,0.05);
  }
  .badge-clip svg{ width:28px; height:28px; }

  .login-card{
    position:relative;
    background:var(--panel);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    padding:56px 36px 34px;
    box-shadow:
      0 40px 80px -25px rgba(0,0,0,0.65),
      inset 0 1px 0 rgba(255,255,255,0.08);
    transform-style:preserve-3d;
  }

  /* holographic edge sheen */
  .login-card::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:inherit;
    padding:1px;
    background:linear-gradient(120deg, rgba(124,92,252,0.7), rgba(34,211,238,0.1) 30%, rgba(34,211,238,0.6) 60%, rgba(124,92,252,0.1));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:0.7;
    pointer-events:none;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--cyan);
    text-align:center;
    text-transform:uppercase;
    margin-bottom:10px;
    opacity:0.85;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:26px;
    font-weight:700;
    text-align:center;
    letter-spacing:-0.01em;
  }

  .subtitle{
    text-align:center;
    color:var(--ink-dim);
    font-size:13.5px;
    margin-top:6px;
    margin-bottom:32px;
  }

  label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:8px;
  }

  .field{
    position:relative;
    margin-bottom:20px;
    transform:translateZ(10px);
  }

  input{
    width:100%;
    padding:13px 14px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:10px;
    color:var(--ink);
    font-size:14.5px;
    font-family:'Inter', sans-serif;
    transition:border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }

  input::placeholder{ color:#5b6480; }

  input:focus{
    outline:none;
    border-color:var(--violet);
    background:rgba(124,92,252,0.06);
    box-shadow:0 0 0 3px rgba(124,92,252,0.18);
  }

  button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(120deg, var(--violet), var(--cyan));
    color:#0a0e1a;
    font-family:'Space Grotesk', sans-serif;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.01em;
    cursor:pointer;
    margin-top:6px;
    transform:translateZ(14px);
    box-shadow:0 14px 28px -10px rgba(124,92,252,0.55);
    transition:transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }

  button:hover:not(:disabled){
    transform:translateZ(14px) translateY(-2px);
    box-shadow:0 18px 34px -8px rgba(34,211,238,0.5);
  }

  button:disabled{
    opacity:0.65;
    cursor:not-allowed;
    transform:translateZ(14px);
  }

  #message{
    text-align:center;
    margin-top:18px;
    font-size:13.5px;
    min-height:18px;
    font-family:'JetBrains Mono', monospace;
  }

  .foot-note{
    text-align:center;
    margin-top:24px;
    font-size:11px;
    color:#4d5570;
    font-family:'JetBrains Mono', monospace;
    letter-spacing:0.04em;
  }

  @media (prefers-reduced-motion: reduce){
    .stage{ animation:none; transform:none; }
    .particle{ animation:none; display:none; }
  }
</style>
</head>

<body>

<div class="floor"></div>

<div class="stage" id="stage">
  <div class="badge-clip">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12 2 4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4Z" fill="white" fill-opacity="0.92"/>
      <path d="M9 12.2 11.2 14.4 15.5 10" stroke="#0a0e1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="login-card">
    <p class="eyebrow">Restricted Access</p>
    <h1>Admin Console</h1>
    <p class="subtitle">Kashru Technologies</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@kashrutechnologies.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>

      <button type="submit" id="loginBtn">Login</button>
    </form>

    <p id="message"></p>
    <p class="foot-note">Session encrypted &middot; Authorized personnel only</p>
  </div>
</div>

<script>
  // ---- ambient particles ----
  const body = document.body;
  for (let i = 0; i < 22; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.bottom = (Math.random() * -20) + 'vh';
    p.style.animationDelay = (Math.random() * 14) + 's';
    p.style.animationDuration = (10 + Math.random() * 10) + 's';
    body.appendChild(p);
  }

  // ---- 3D tilt following the pointer ----
  const stage = document.getElementById('stage');
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!prefersReduced){
    window.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) - 0.5;
      const y = (e.clientY / window.innerHeight) - 0.5;
      stage.style.transform = `rotateY(${x * -16 - 8}deg) rotateX(${y * 14 + 6}deg)`;
    });

    window.addEventListener('mouseleave', () => {
      stage.style.transform = 'rotateX(6deg) rotateY(-8deg)';
    });
  }

  // ---- original login logic, unchanged ----
  const API_URL = "https://kashru-backend.onrender.com";

  document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const button = document.getElementById("loginBtn");
        const message = document.getElementById("message");

        button.disabled = true;
        button.textContent = "Logging in...";
        message.textContent = "";
        message.style.color = "";

        try {

            const body = new URLSearchParams();

            body.append("email", email);
            body.append("password", password);

            const response = await fetch(
                `${API_URL}/api/admin/login`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body: body.toString()
                }
            );

           const responseText = await response.text();

           if (!response.ok) {
               throw new Error(
                   responseText || "Invalid email or password"
               );
           }

           const data = JSON.parse(responseText);

            localStorage.setItem(
                "admin",
                JSON.stringify(data)
            );

            message.style.color = "#4ade9a";
            message.textContent = "Login successful!";

            // Dashboard next step
            setTimeout(() => {
                window.location.href = "admin-dashboard.html";
            }, 800);

        } catch (error) {

            console.error(error);

            message.style.color = "#ff6b81";
            message.textContent =
                error.message || "Login failed";

        } finally {

            button.disabled = false;
            button.textContent = "Login";

        }

    });
</script>

</body>
</html>
