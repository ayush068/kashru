<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Kashru Technologies</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .navbar {
            height: 70px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .logout {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .container {
            padding: 30px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin-bottom: 8px;
        }

        .welcome p {
            color: #6b7280;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #6b7280;
            margin-bottom: 12px;
        }

        .card .number {
            font-size: 32px;
            font-weight: bold;
        }

        .menu {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .menu-item {
            background: white;
            padding: 25px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: 0.2s;
        }

        .menu-item:hover {
            transform: translateY(-3px);
        }

        .menu-item h3 {
            margin-bottom: 8px;
        }

        .menu-item p {
            color: #6b7280;
        }
    </style>
</head>

<body>

<nav class="navbar">

    <h2>Kashru Technologies Admin</h2>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</nav>


<div class="container">

    <div class="welcome">

        <h1>Admin Dashboard</h1>

        <p id="welcomeText">
            Welcome Admin
        </p>

    </div>


    <div class="cards">

        <div class="card">

            <h3>Total Contacts</h3>

            <div class="number" id="contactCount">
                0
            </div>

        </div>


        <div class="card">

            <h3>Total Products</h3>

            <div class="number">
                0
            </div>

        </div>


        <div class="card">

            <h3>Total Projects</h3>

            <div class="number">
                0
            </div>

        </div>


        <div class="card">

            <h3>Admin Status</h3>

            <div class="number">
                Active
            </div>

        </div>

    </div>


    <div class="menu">

        <div class="menu-item">

            <h3>📩 Contacts</h3>

            <p>
                View website contact messages
            </p>

        </div>


        <div class="menu-item">

            <h3>📦 Products</h3>

            <p>
                Manage products
            </p>

        </div>


        <div class="menu-item">

            <h3>🚀 Projects</h3>

            <p>
                Manage projects
            </p>

        </div>


        <div class="menu-item">

            <h3>⚙️ Settings</h3>

            <p>
                Admin settings
            </p>

        </div>

    </div>

</div>


<script>

    // Check login

    const admin = localStorage.getItem("admin");

    if (!admin) {

        window.location.href = "admin-login.html";

    }


    // Show admin information

    if (admin) {

        try {

            const data = JSON.parse(admin);

            document.getElementById("welcomeText").textContent =
                "Welcome, " + (data.name || "Admin");

        } catch (error) {

            console.log(error);

        }

    }


    // Logout

    function logout() {

        localStorage.removeItem("admin");

        window.location.href = "admin-login.html";

    }

</script>

</body>
</html>
